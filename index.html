<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12241b"><title>Kangaroo FreshMart Accounts</title>
<style>
:root{--bg:#f3f6f2;--surface:#fff;--surface2:#f8faf7;--text:#17251c;--muted:#718075;--line:#e2e9e1;--brand:#187344;--brand2:#e1f5e8;--red:#c44747;--redbg:#fff0ee;--gold:#9c6b14;--shadow:0 8px 30px #193b2410}
[data-theme="dark"]{--bg:#101812;--surface:#19241c;--surface2:#202d23;--text:#edf5ee;--muted:#a2b1a4;--line:#304033;--brand:#58d18a;--brand2:#203e2b;--red:#ff8278;--redbg:#432321;--gold:#f4c46d;--shadow:0 8px 30px #0003;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
.topbar{background:linear-gradient(115deg,#10251a,#1b5837);color:#fff;padding:18px max(16px,calc((100vw - 1320px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;background:#ffffff19;border:1px solid #ffffff2b;border-radius:14px;font-size:24px}.brand h1{font-size:20px;line-height:1.2;margin:0}.brand p{font-size:12px;color:#c7ddcf;margin:5px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:650;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:#ffffff12;color:#fff;border-color:#ffffff38}.btn.danger{background:var(--redbg);color:var(--red);border-color:transparent}.btn.small{padding:5px 8px;font-size:12px;border-radius:8px}
.layout{max-width:1320px;margin:0 auto;padding:18px 16px 50px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.sidebar{align-self:start;position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:10px;box-shadow:var(--shadow)}.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:12px 10px 7px}.nav-btn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;text-align:left;font-weight:650;margin:2px 0}.nav-btn .ico{width:22px;text-align:center;font-size:16px}.nav-btn.active{background:var(--brand2);color:var(--brand)}.main{min-width:0}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 16px;flex-wrap:wrap}.pagehead h2{margin:0;font-size:24px;letter-spacing:-.5px}.pagehead p{margin:5px 0 0;color:var(--muted)}.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.metric-card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700}.metric-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand2);color:var(--brand);font-size:17px}.metric-value{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:12px;overflow-wrap:anywhere}.metric-foot{font-size:11px;color:var(--muted);margin-top:4px}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}.panel{margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.panel h3{margin:0;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--brand2);color:var(--brand);font-size:11px;font-weight:750}.pill.red{background:var(--redbg);color:var(--red)}.pill.gold{background:#fff4d8;color:var(--gold)}
.grid-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:5px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface2)}.positive{color:var(--brand);font-weight:750}.negative{color:var(--red);font-weight:750}.empty{text-align:center!important;padding:28px;color:var(--muted)}
.bars{display:grid;gap:13px}.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}.bar.red i{background:var(--red)}
.search{max-width:260px}.hide{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#14261b;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:min(90vw,420px)}.notice{border:1px solid #e7d9a5;background:#fff9e8;color:#785b12;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:12px}.dark .notice{background:#382f18}
.bottomnav{display:none}.inline-note{font-size:11px;color:var(--muted);margin-top:9px}.balance-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.balance-row:last-child{border:0}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:3px;padding:7px}.nav-label{display:none}.nav-btn{width:auto;white-space:nowrap;margin:0}.nav-btn .ico{width:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:600px){.topbar{padding:13px}.brand h1{font-size:17px}.logo{width:39px;height:39px}.top-actions .btn{padding:8px 9px;font-size:11px}.layout{padding:12px 10px 85px;gap:10px}.sidebar{border-radius:13px}.nav-btn{font-size:11px;padding:9px}.nav-btn .ico{display:none}.pagehead h2{font-size:21px}.metric-card,.panel{padding:12px;border-radius:13px}.metric-value{font-size:21px}.metric-icon{width:29px;height:29px}.cards{gap:8px}.grid-form{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field.full{grid-column:1/-1}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;z-index:10}.bottomnav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;padding:3px}.bottomnav button span{font-size:17px}.bottomnav button.active{color:var(--brand);font-weight:800}.search{max-width:100%;width:100%}.pagehead{margin-bottom:12px}}
@media print{.topbar,.sidebar,.bottomnav,.page-actions,.no-print,.notice{display:none!important}.layout{display:block;padding:0}.panel,.metric-card{box-shadow:none;break-inside:avoid}.main>.page:not(.print-current){display:none!important}body{background:#fff;color:#000}.table-wrap{overflow:visible}table{min-width:0;font-size:9px}th,td{padding:5px}.panel{border:1px solid #ddd}}
.metric-card{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.metric-card:hover{transform:translateY(-2px)}
.metric-card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--brand),#7be0a6)}
.panel{border-radius:18px}.nav-btn.active{box-shadow:inset 3px 0 0 var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters input,.filters select{width:auto;min-width:150px}
.jt td{padding:6px 12px;border-bottom:0}.jt tr.jf td{border-top:1px solid var(--line)}.jt td.cr{padding-left:36px}.jt .nar{color:var(--muted);font-style:italic;font-size:11px;padding-bottom:10px}
.jt tfoot th{font-size:12px;color:var(--text);border-top:2px solid var(--text)}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sheet-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sheet-total{display:flex;justify-content:space-between;padding:12px 0 0;margin-top:6px;font-weight:800;font-size:15px;border-top:2px solid var(--text)}
.sheet-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 2px}
.vl{display:grid;grid-template-columns:1fr 140px;gap:10px;margin-bottom:8px}
@media(max-width:700px){.bs{grid-template-columns:1fr}.vl{grid-template-columns:1fr 100px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="logo">🦘</div><div><h1 id="brandTitle">Kangaroo FreshMart Accounts</h1><p id="brandSub">Personal accounts · Double-entry ledger</p></div></div>
 <div class="top-actions">
  <button class="btn ghost" id="langBtn">বাংলা</button><button class="btn ghost" id="themeBtn">◐ Theme</button>
  <button class="btn ghost" id="exportAllBtn">⇩ Excel (all)</button><button class="btn ghost" id="backupBtn">↧ Backup</button><button class="btn ghost" id="restoreBtn">↥ Restore</button><input id="restoreFile" type="file" accept=".json,application/json" hidden>
 </div>
</header>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="nav-label">Workspace</div>
  <button class="nav-btn active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>

  <button class="nav-btn" data-page="journal"><span class="ico">✎</span>Journal</button>
  <button class="nav-btn" data-page="cashbook"><span class="ico">☰</span>Cash book</button>
  <button class="nav-btn" data-page="balance"><span class="ico">⚖</span>Balance sheet</button>
  <button class="nav-btn" data-page="gl"><span class="ico">▥</span>General ledger</button>
  <button class="nav-btn" data-page="statements"><span class="ico">§</span>Financial statements</button>
  <button class="nav-btn" data-page="caprev"><span class="ico">◐</span>Capital & revenue</button>
  <div class="nav-label">Management</div>
  <button class="nav-btn" data-page="debtors"><span class="ico">♧</span>Debtors & reminders</button>
  <button class="nav-btn" data-page="inventory"><span class="ico">▦</span>Inventory</button>
  <button class="nav-btn" data-page="receipts"><span class="ico">▧</span>Receipts</button>
  <button class="nav-btn" data-page="vouchers"><span class="ico">❖</span>Vouchers</button>
  <button class="nav-btn" data-page="reports"><span class="ico">▥</span>Reports</button>
  <div class="nav-label">App</div>

 </aside>
 <main class="main" id="main">
  <section class="page" id="dashboard"></section><section class="page hide" id="entry"></section><section class="page hide" id="ledger"></section>
  <section class="page hide" id="accounts"></section><section class="page hide" id="debtors"></section><section class="page hide" id="inventory"></section>
  <section class="page hide" id="receipts"></section><section class="page hide" id="reports"></section><section class="page hide" id="journal"></section><section class="page hide" id="cashbook"></section><section class="page hide" id="balance"></section><section class="page hide" id="vouchers"></section><section class="page hide" id="gl"></section><section class="page hide" id="statements"></section><section class="page hide" id="caprev"></section><section class="page hide" id="settings"></section>
 </main>
</div>
<div class="bottomnav" id="bottomnav">
 <button data-page="dashboard" class="active"><span>⌂</span>Home</button><button data-page="entry"><span>＋</span>Add</button><button data-page="ledger"><span>▤</span>Ledger</button><button data-page="reports"><span>▥</span>Reports</button><button data-page="settings"><span>⚙</span>More</button>
</div>
<div id="toast" class="toast hide"></div>
<script>
const LEGACY_SEED = `2026-10-23|Borrow money from Saad||ca450,cd450
2026-10-23|Cutting hair|Expenses|ca-100,eq-100
2026-10-22|Print of assignment cover page|Expenses|ca-20,eq-20
2026-10-21|Abbu|Capital|sv1000,eq1000
2026-10-19|Saad k dese|Expenses|ng-10,eq-10
2026-10-18|Some saving|Capital|ca40,eq40
2026-10-16|Cash out from bKash and save||bk-500,sv500
2026-10-11|Saad paid the debtors||db-50,sv50
2026-10-11|Abbu gimme money|Revenue|bk350,eq350
2026-10-10|Income of Ammu|Revenue|bk11,eq11
2026-10-10|Saad paid debtors||db-100,sv100
2026-10-10|Rent iPhone to Saad|Revenue|db500,eq500
2026-10-10|Borrow money to Saad by phone||db2200,sv-2200
2026-10-07|Saud taking withdrawal|Drawing|ca-100,eq-100
2026-10-05|Ramim||ca100,db-100
2026-10-03|Mortgage to Ramim||ca-100,db100
2026-09-29|Buy some food|Expenses|ca-25,eq-25
2026-09-26|Buy jalmury and others|Expenses|ca-25,eq-25
2026-09-25|Buy and add|Expenses|bk-312,ng23.36,eq-288.64
2026-09-25|Climate innovation and leadership club|Revenue|sv200,eq200
2026-09-25|Transport paid by cash|Expenses|ca-50,eq-50
2026-09-24|Ammu gimme cash|Revenue|ca50,eq50
2026-09-23|Santer fruit and juice|Expenses|ca-20,eq-20
2026-09-21|Transport of Shahin sir|Expenses|ca-10,eq-10
2026-09-21|Shingara|Expenses|ca-20,eq-20
2026-09-19|From the desk|Revenue|ca20,eq20
2026-09-17|Santer fruit and shingara|Expenses|ca-20,eq-20
2026-09-16|Mobile recharge|Expenses|bk-50,eq-50
2026-09-14|Jamurei|Expenses|ca-10,eq-10
2026-09-13|Deposit|Expenses|ca-10,eq-10
2026-09-13|Arfat||ca20,db-20
2026-09-13|Eharat Fatema|Revenue|ca100,eq100
2026-09-13|Esharat Fatema|Capital|ca100,eq100
2026-09-13|Give money|Revenue|bk800,eq800
2026-09-12|Ammu give money to us|Revenue|bk100,eq100
2026-09-12|Service income|Revenue|ng5,eq5
2026-09-11|School class party|Expenses|ca-100,eq-100
2026-09-09|Tiffin|Expenses|ca-20,eq-20
2026-09-09|Ammu paid the debtors||ca100,db-100
2026-09-07|Cut my hair||ca-100,db100
2026-09-06|Travel with Yeasin and Saud|Expenses|ca-100,eq-100
2026-09-03|Buy some vegetable for Yeasin||ca-20,db20
2026-09-01|Saad paid the debtors||ca40,db-40
2026-08-31|Start|Capital|ca300,bk72.05,ng329.64,db40,sv2000,eq2741.69`;
const ASSET=[['ca','Cash'],['bk','bKash'],['ng','Nagad'],['db','Debtors'],['sv','Saving'],['ot','Others']];
const LIABILITY=[['cd','Creditors'],['ln','Loan'],['rl','Recharge loan'],['o2','Others2']];
const EQUITY=[['eq','Equity']];
const ALL=ASSET.concat(LIABILITY,EQUITY);
const KEY='kfm_entries_v1', EXTRA='kfm_pro_extra_v1', SETTINGS='kfm_pro_settings_v1';
const $=id=>document.getElementById(id);
let entries=[],extra={debtors:[],products:[],receipts:[],vouchers:[]},settings={title:'Kangaroo FreshMart Accounts',currency:'৳',lang:'en',theme:'light'},currentPage='dashboard',currentAccount='ca';
function parseSeed(){return LEGACY_SEED.split('\n').map((line,i)=>{const p=line.split('|'),v={};(p[3]||'').split(',').forEach(x=>{const m=x.match(/^([a-z0-9]+?)(-?[\d.]+)$/);if(m)v[m[1]]=Number(m[2])});return{id:'s'+i,date:p[0],desc:p[1],note:p[2],v}})}
function load(){try{const e=JSON.parse(localStorage.getItem(KEY));entries=Array.isArray(e)?e:parseSeed()}catch(e){entries=parseSeed()}try{const x=JSON.parse(localStorage.getItem(EXTRA));if(x&&typeof x==='object')extra={...extra,...x}}catch(e){}try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch(e){}}
function save(){queuePush();try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(EXTRA,JSON.stringify(extra));localStorage.setItem(SETTINGS,JSON.stringify(settings))}catch(e){toast('Browser storage is full. Export a backup before continuing.')}renderAll()}
function money(n){return (n<0?'-':'')+(settings.currency||'৳')+Math.abs(Number(n||0)).toLocaleString('en-BD',{minimumFractionDigits:0,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){return s?new Date(s+'T00:00:00').toLocaleDateString(settings.lang==='bn'?'bn-BD':'en-GB',{day:'2-digit',month:'short',year:'numeric'}):''}
function total(k){return entries.reduce((s,e)=>s+Number((e.v||{})[k]||0),0)}
function balData(){return ALL.map(([key,name])=>({key,name,total:total(key),type:ASSET.some(a=>a[0]===key)?'Asset':LIABILITY.some(a=>a[0]===key)?'Liability':'Equity'}))}
function assetTotal(){return ASSET.reduce((s,a)=>s+total(a[0]),0)}
function liabilityTotal(){return LIABILITY.reduce((s,a)=>s+total(a[0]),0)}
function equityTotal(){return total('eq')}
function revenueTotal(){return entries.filter(e=>e.note==='Revenue').reduce((s,e)=>s+Number(e.v.eq||0),0)}
function expenseTotal(){return -entries.filter(e=>e.note==='Expenses').reduce((s,e)=>s+Number(e.v.eq||0),0)}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hide');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>$('toast').classList.add('hide'),2500)}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div><div class="page-actions">${action}</div></div>`}
function table(headers,rows,empty='No records yet.'){return `<div class="table-wrap"><table><thead><tr>${headers.map((h,i)=>`<th class="${i>0&&h.startsWith('num:')?'num':''}">${h.replace(/^num:/,'')}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function metric(label,value,icon,foot=''){return `<div class="metric-card"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function renderDashboard(){const rev=revenueTotal(),exp=expenseTotal(),cash=total('ca'),asset=assetTotal(),liab=liabilityTotal(),eq=equityTotal(),sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).slice(0,7);
const recent=sorted.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(e.note||'—')}</td><td class="num">${money(Object.values(e.v||{}).reduce((s,v)=>s+Math.abs(v),0)/2)}</td></tr>`).join('');
$('dashboard').innerHTML=pageHead('Dashboard','Your accounts at a glance',`<button class="btn primary" data-goto="entry">＋ New entry</button>`)+
`<div class="notice">Your original ledger is loaded below. This app stores changes in this browser; use Backup to keep a copy. GitHub Pages itself does not sync data across devices.</div>
<div class="cards">${metric('Total assets',money(asset),'◈','Cash, mobile wallet, savings and debtors')}${metric('Liabilities',money(liab),'⇄','Creditors and loans')}${metric('Cash balance',money(cash),'৳','Cash account')}${metric('Net income',money(rev-exp),'↗',`${money(rev)} income · ${money(exp)} expenses`)}</div>
<div class="two-col"><div class="panel"><div class="panel-head"><h3>Recent activity</h3><button class="btn small" data-goto="ledger">View ledger →</button></div>${table(['Date','Description','Type','num:Amount'],recent,'No entries found.')}</div>
<div class="panel"><div class="panel-head"><h3>Account balances</h3><span class="pill">Live totals</span></div><div class="bars">${ASSET.map(([k,n])=>{let v=total(k);let max=Math.max(1,...ASSET.map(a=>Math.abs(total(a[0]))));return `<div><div class="bar-label"><span>${n}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${Math.min(100,Math.abs(v)/max*100)}%"></i></div></div>`}).join('')}</div><div class="balance-row"><span class="muted">Liabilities + equity</span><b>${money(liab+eq)}</b></div></div></div>
<div class="panel"><div class="panel-head"><h3>Ledger health</h3><span class="pill ${Math.abs(asset-liab-eq)<.005?'':'red'}">${Math.abs(asset-liab-eq)<.005?'Balanced':'Needs review'}</span></div><p class="muted small">Legacy transactions are preserved as they appeared in your previous HTML. Some historical entries use balance-change style records rather than explicit debit/credit journals, so review the ledger before treating totals as final financial statements.</p></div>`;
}
function opts(list,selected){return list.map(a=>`<option value="${a[0]}" ${a[0]===selected?'selected':''}>${a[1]}</option>`).join('')}
function renderEntry(){const accounts=ALL;

function toCsv(rows){return '\ufeff'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function pageSheets(id){const out=[],cl=t=>t.textContent.trim().replace(/\s+/g,' ');
document.querySelectorAll('#'+id+' .panel').forEach((p,i)=>{const h=p.querySelector('h3'),name=h?cl(h):id,ts=p.querySelectorAll('table');
if(ts.length)ts.forEach(t=>out.push([name,[...t.querySelectorAll('tr')].map(tr=>{const r=[];[...tr.children].forEach(c=>{r.push(cl(c));for(let k=1;k<(c.colSpan||1);k++)r.push('')});return r})]));
else{const rows=[...p.querySelectorAll('.sheet-row,.sheet-total,.sheet-h,.balance-row')].map(r=>r.children.length>1?[cl(r.firstElementChild),cl(r.lastElementChild)]:[cl(r),'']);if(rows.length)out.push([name,rows])}});return out}
function stamp(){return new Date().toISOString().slice(0,10)}
function exportPage(id,fmt){const sh=pageSheets(id);if(!sh.length){toast('Nothing to export on this page.');return}
if(fmt==='csv'){let rows=[];sh.forEach(([n,r],i)=>{if(i)rows.push([]);if(sh.length>1)rows.push([n]);rows=rows.concat(r)});download(`kangaroo-${id}-${stamp()}.csv`,toCsv(rows),'text/csv;charset=utf-8')}
else download(`kangaroo-${id}-${stamp()}.xlsx`,buildXlsx(sh),'application/octet-stream');toast('Exported '+id+' as '+(fmt==='csv'?'CSV':'Excel')+'.')}
function exportAllExcel(){const K=ASSET.concat(LIABILITY),A=asc(),led=[['Date','Day','Particulars','Note','Type'].concat(K.map(k=>k[1]),['Equity'])],jr=[['Date','J.F.','Account','Dr/Cr','Debit','Credit']],gl=[['Account','Date','J.F.','Particulars','Debit','Credit']];
A.forEach(e=>{led.push([e.date,new Date(e.date+'T00:00').toLocaleDateString('en',{weekday:'long'}),e.desc,e.note||'',cat(e)].concat(K.map(k=>Number(e.v[k[0]]||0)),[Number(e.v.eq||0)]));const{dr,cr}=jLines(e);dr.forEach(([n,a])=>jr.push([e.date,'J'+e.jn,n+' A/c','Dr',a,'']));cr.forEach(([n,a])=>jr.push([e.date,'J'+e.jn,'To '+n+' A/c','Cr','',a]))});
const m=glAcc();Object.keys(m).forEach(n=>{m[n].dr.forEach(x=>gl.push([n,x[0].date,'J'+x[0].jn,x[1],x[2],'']));m[n].cr.forEach(x=>gl.push([n,x[0].date,'J'+x[0].jn,x[1],'',x[2]]))});
const tb=[['Account','Debit','Credit']],N=n=>tot(e=>e.note===n,['eq']);let D=0,C=0;const put=(n,v,dr)=>{const a=Math.abs(v);if(!a)return;const d=dr?v>0:v<0;tb.push([n,d?a:'',d?'':a]);d?D+=a:C+=a};
ASSET.forEach(([k,n])=>put(n,total(k),true));LIABILITY.forEach(([k,n])=>put(n,total(k),false));put('Capital',N('Capital'),false);put('Revenue',N('Revenue'),false);put('Expenses',N('Expenses'),false);put('Drawings',N('Drawing'),false);tb.push(['Total',+D.toFixed(2),+C.toFixed(2)]);
download(`kangaroo-freshmart-all-${stamp()}.xlsx`,buildXlsx([['Ledger',led],['Journal',jr],['General Ledger',gl],['Trial Balance',tb]]),'application/octet-stream');toast('Excel workbook downloaded (4 sheets).')}
function addExportBtns(){document.querySelectorAll('.page').forEach(p=>{if(p.id==='entry'||p.id==='settings')return;const a=p.querySelector('.page-actions');if(a&&!a.querySelector('[data-exp]'))a.insertAdjacentHTML('beforeend','<button class="btn no-print" data-exp="csv">⇩ CSV</button><button class="btn primary no-print" data-exp="xlsx">⇩ Excel</button>')})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.exp)exportPage(t.closest('.page').id,t.dataset.exp);if(t.id==='exportAllBtn')exportAllExcel()});

const FBK='kfm_fb_cfg',BASEK='kfm_base',TSK='kfm_local_ts';
let fb=null,fbUser=null,syncMsg='',baseIds=new Set(),localTs=0,pushT=null,fbUnsub=null,lastDel=[];
try{baseIds=new Set(JSON.parse(localStorage.getItem(BASEK)||'[]'));localTs=Number(localStorage.getItem(TSK)||0)}catch(e){}
const FB_DEFAULT={apiKey:'AIzaSyAXBvdyJ1OvpUtRCPLy_xicZHunxgOhFVU',authDomain:'kangaroo-accounts.firebaseapp.com',databaseURL:'https://kangaroo-accounts-default-rtdb.firebaseio.com',projectId:'kangaroo-accounts'};
const fbCfg=()=>{try{return JSON.parse(localStorage.getItem(FBK))||FB_DEFAULT}catch(e){return FB_DEFAULT}};
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Could not load '+u.split('/').pop()+'. The page is offline, in a preview, or blocked by an ad blocker. Open it from your GitHub Pages link.'));document.head.appendChild(s)});
async function fbInit(){const cfg=fbCfg();if(!cfg||fb)return;cfg.databaseURL=cfg.databaseURL||'https://'+cfg.projectId+'-default-rtdb.firebaseio.com';try{const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-database-compat.js')]);firebase.initializeApp(cfg);fb={auth:firebase.auth(),db:firebase.database()};
fb.auth.onAuthStateChanged(u=>{fbUser=u;if(fbUnsub){fbUnsub();fbUnsub=null}if(u){syncMsg='Connected as '+u.email;const rf=fb.db.ref('kfm/'+u.uid),cb=s=>onRemote({metadata:{hasPendingWrites:false},exists:s.exists(),data:()=>s.val()});rf.on('value',cb,err=>{syncMsg='Sync error: '+err.message;renderSync()});fbUnsub=()=>rf.off('value',cb)}else syncMsg='Signed out';renderSync()})}catch(e){syncMsg='Could not start Firebase: '+(e&&e.message||e);renderSync()}}
function queuePush(){localTs=Date.now();try{localStorage.setItem(TSK,localTs)}catch(e){}clearTimeout(pushT);pushT=setTimeout(pushCloud,700)}
function pushCloud(){if(!fb||!fbUser)return;const loc=new Set(entries.map(e=>e.id)),del=new Set(lastDel);baseIds.forEach(id=>{if(!loc.has(id))del.add(id)});lastDel=[...del];
fb.db.ref('kfm/'+fbUser.uid).set({entries:JSON.stringify(entries.filter(e=>!del.has(e.id))),deleted:lastDel,extra:JSON.stringify(extra),updatedAt:Math.max(Date.now(),localTs)}).then(()=>{syncMsg='Synced '+new Date().toLocaleTimeString();renderSync()}).catch(e=>{syncMsg='Upload failed: '+e.message;renderSync()})}
function onRemote(snap){if(snap.metadata.hasPendingWrites)return;const r=snap.exists?snap.data():null;if(!r){pushCloud();return}
let rem;try{rem=JSON.parse(r.entries||'[]')}catch(e){return}
const del=new Set(r.deleted||[]),loc=new Map(entries.map(e=>[e.id,e]));baseIds.forEach(id=>{if(!loc.has(id))del.add(id)});
const m=new Map();rem.forEach(e=>{if(!del.has(e.id))m.set(e.id,e)});entries.forEach(e=>{if(!del.has(e.id)&&(!m.has(e.id)||localTs>(r.updatedAt||0)))m.set(e.id,e)});
const merged=[...m.values()],changed=JSON.stringify(merged)!==JSON.stringify(entries);entries=merged;lastDel=[...del];
if(r.extra&&(r.updatedAt||0)>localTs){try{extra={...extra,...JSON.parse(r.extra)}}catch(e){}}
baseIds=new Set(merged.map(e=>e.id));
try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(EXTRA,JSON.stringify(extra));localStorage.setItem(BASEK,JSON.stringify([...baseIds]))}catch(e){}
if(changed)renderAll();
if(JSON.stringify(rem)!==JSON.stringify(merged)||del.size!==(r.deleted||[]).length)pushCloud();else{syncMsg='Synced '+new Date().toLocaleTimeString();renderSync()}}
function renderSync(){const s=$('settings');if(!s)return;let p=$('syncPanel');if(!p||p.parentNode!==s){p=document.createElement('div');p.id='syncPanel';p.className='panel';s.appendChild(p)}const cfg=fbCfg(),pe=$('fbEm')?$('fbEm').value:'',pp=$('fbPw')?$('fbPw').value:'';
p.innerHTML=`<div class="panel-head"><h3>☁ Cloud sync (phone ⇄ computer)</h3><span class="pill ${fbUser?'':'gold'}">${fbUser?'On':'Off'}</span></div>`+(!cfg?`<p class="muted small">Paste your Firebase web-app config (Project settings → Your apps → Web).</p><textarea id="fbCfg" placeholder="{ apiKey: '…', authDomain: '…', projectId: '…', appId: '…' }"></textarea><div class="actions"><button class="btn primary" id="fbSaveCfg">Save config</button></div>`:!fbUser?`<div class="grid-form"><div class="field"><label>Email</label><input id="fbEm" type="email" autocomplete="username" value="${esc(pe)}"></div><div class="field"><label>Password (6+ characters)</label><input id="fbPw" type="password" autocomplete="current-password" value="${esc(pp)}"></div></div><div class="actions"><button class="btn primary" id="fbIn">Sign in</button><button class="btn" id="fbUp">Create account</button><button class="btn danger" id="fbRm">Remove config</button></div>`:`<div class="actions"><button class="btn primary" id="fbNow">Sync now</button><button class="btn" id="fbOut">Sign out</button></div>`)+`<div class="inline-note">${esc(syncMsg)}</div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const v=id=>$(id)?$(id).value.trim():'',er=x=>toast(x.message||'Failed');
if(t.id==='fbSaveCfg'){try{const m=v('fbCfg').match(/\{[\s\S]*\}/),o=JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}'));if(!o.apiKey||!o.projectId)throw 0;o.databaseURL=o.databaseURL||'https://'+o.projectId+'-default-rtdb.firebaseio.com';localStorage.setItem(FBK,JSON.stringify(o));syncMsg='Config saved. Loading…';renderSync();fbInit()}catch(x){toast('Could not read that config.')}}
if(t.id==='fbIn'||t.id==='fbUp'){if(!fb){syncMsg='Firebase has not started. '+(syncMsg||'Loading…')+' Retrying now.';renderSync();toast('Firebase has not started yet.');fbInit();return}
const em=v('fbEm'),pw=$('fbPw').value;if(!em||pw.length<6){toast('Enter your email and a password of 6+ characters.');return}
syncMsg='Please wait…';renderSync();(t.id==='fbIn'?fb.auth.signInWithEmailAndPassword(em,pw):fb.auth.createUserWithEmailAndPassword(em,pw)).catch(x=>{syncMsg='Error: '+(x.code||'')+' '+(x.message||'');renderSync();toast(x.message||'Failed')})}
if(t.id==='fbOut'&&fb)fb.auth.signOut();
if(t.id==='fbNow'&&fb&&fbUser)fb.db.ref('kfm/'+fbUser.uid).get().then(s=>onRemote({metadata:{hasPendingWrites:false},exists:s.exists(),data:()=>s.val()})).catch(er);
if(t.id==='fbRm'&&confirm('Remove Firebase config from this device?')){localStorage.removeItem(FBK);location.reload()}});

function exportCsv(){const keys=ALL.map(a=>a[0]);const headers=['Date','Description','Category',...keys.map(k=>(ALL.find(a=>a[0]===k)||[k,k])[1])];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[headers.map(q).join(','),...entries.map(e=>[e.date,e.desc,e.note,...keys.map(k=>e.v?.[k]||0)].map(q).join(','))].join('\r\n');download('kangaroo-freshmart-ledger.csv',csv,'text/csv;charset=utf-8')}

document.addEventListener('click',e=>{const goto=e.target.closest('[data-goto]');if(goto){go(goto.dataset.goto);return}const ta=e.target.closest('[data-taccount]');if(ta){renderTAccount(ta.dataset.taccount);return}const del=e.target.closest('[data-delete]');if(del){const id=del.dataset.delete;if(confirm('Delete this transaction?')){entries=entries.filter(x=>String(x.id)!==String(id));save();toast('Transaction deleted.')}return}const ed=e.target.closest('[data-edit]');if(ed){const ent=entries.find(x=>String(x.id)===String(ed.dataset.edit));if(!ent)return;const d=prompt('Date (YYYY-MM-DD)',ent.date);if(d===null)return;const desc=prompt('Description',ent.desc);if(desc===null)return;if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d)||!desc.trim()){toast('Please enter a valid date and description.');return}ent.date=d;ent.desc=desc.trim();save();return}const remind=e.target.closest('[data-remind]');if(remind){const d=extra.debtors[Number(remind.dataset.remind)];if(!d)return;const msg=`Hello ${d.name}, a friendly reminder that ${money(d.amount)} is pending${d.due?' and was due on '+d.due:''}. Please let me know when convenient. Thank you.`;let phone=(d.phone||'').replace(/\\D/g,'');if(phone.startsWith('0'))phone='88'+phone;if(!phone){if(navigator.clipboard)navigator.clipboard.writeText(msg);toast('No phone number saved; reminder text copied if supported.');return}window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener');return}const dd=e.target.closest('[data-debtor-del]');if(dd&&confirm('Delete this debtor?')){extra.debtors.splice(Number(dd.dataset.debtorDel),1);save();return}const stock=e.target.closest('[data-stock]');if(stock){const i=Number(stock.dataset.stock),p=extra.products[i],q=prompt('New quantity for '+p.name,p.qty);if(q!==null&&Number(q)>=0){p.qty=Number(q);save()}return}const sd=e.target.closest('[data-stock-del]');if(sd&&confirm('Delete this product?')){extra.products.splice(Number(sd.dataset.stockDel),1);save();return}const rp=e.target.closest('[data-receipt]');if(rp){const r=extra.receipts[Number(rp.dataset.receipt)];if(!r)return;const w=window.open('','_blank','width=700,height=650');w.document.write(`<html><head><title>Receipt ${esc(r.no)}</title><style>body{font:16px Arial;padding:40px;color:#17251c}h1{color:#187344}hr{border:0;border-top:1px solid #ddd;margin:25px 0}.amount{font-size:28px;font-weight:bold}</style></head><body><h1>${esc(settings.title)}</h1><h2>Payment receipt</h2><p>Receipt no: ${esc(r.no)}<br>Date: ${esc(r.date)}</p><hr><p>Received from: <b>${esc(r.customer)}</b></p><p>Purpose: ${esc(r.note||'Payment')}</p><p class="amount">${money(r.amount)}</p><hr><p>Authorized signature: ____________________</p><script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close();return}const rd=e.target.closest('[data-receipt-del]');if(rd&&confirm('Delete this receipt?')){extra.receipts.splice(Number(rd.dataset.receiptDel),1);save()}});
